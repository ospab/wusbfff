<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wusbfff tester</title>
<link rel="icon" href="%%ICON%%">
<style>
  :root { color-scheme: light dark; --b: #8884; }
  body { font: 14px system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  section { border: 1px solid var(--b); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--b); cursor: pointer; margin: 0 6px 6px 0; }
  button:disabled { opacity: .45; cursor: default; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .yes { background: #2a72; color: #2a7; } .no { background: #d332; color: #d33; }
  .dev { padding: 8px; border: 1px solid var(--b); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .dev.sel { outline: 2px solid #38f; }
  .dev small { opacity: .7; display: block; }
  pre { margin: 0; max-height: 280px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .ok { color: #2a7; } .err { color: #d33; }
  code { background: var(--b); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<!--SCRIPTS-->
</body>
</html>
